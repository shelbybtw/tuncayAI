name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project files
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Show available schemes
        run: |
          cd ios
          xcodebuild -list

      - name: Build iOS Application (Unsigned)
        run: |
          cd ios

          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/ {getline; print $1}')

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Create IPA
        run: |
          mkdir Payload

          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)

          cp -R "$APP_PATH" Payload/

          zip -r TuncayAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuncayAI-Unsigned-IPA
          path: TuncayAI.ipa
          if-no-files-found: error
          retention-days: 7
